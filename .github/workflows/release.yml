name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v0.2.0)'
        required: true

# Jobs only get write access where they need it (see the release job)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  APP_NAME: rdap
  IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_USER: xtomcom
  DOCKERHUB_IMAGE: docker.io/xtomcom/rdap

jobs:
  # glibc builds on native runners, linked against glibc 2.17 via zigbuild so
  # they run on most distros (CentOS 7+, Debian 8+, Ubuntu 14.04+)
  build-linux-native:
    name: Build Linux Native (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            glibc: '2.17'
            runner: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            glibc: '2.17'
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo zigbuild --release --target ${{ matrix.target }}.${{ matrix.glibc }}

      - name: Prepare artifact
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp target/${{ matrix.target }}/release/${{ env.APP_NAME }} ${{ env.APP_NAME }}-${VERSION}-linux-${{ matrix.arch }}
          chmod +x ${{ env.APP_NAME }}-${VERSION}-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ env.APP_NAME }}-*-linux-${{ matrix.arch }}

  # Cross-compiled builds using zigbuild (avoids glibc issues)
  build-linux-cross:
    name: Build Linux Cross (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl static builds
          - arch: x86_64-musl
            target: x86_64-unknown-linux-musl
          - arch: aarch64-musl
            target: aarch64-unknown-linux-musl
          # ARM 32-bit
          - arch: armv7
            target: armv7-unknown-linux-gnueabihf
            glibc: '2.17'
          - arch: armv7-musl
            target: armv7-unknown-linux-musleabihf
          # RISC-V (glibc gained riscv64 support in 2.27)
          - arch: riscv64
            target: riscv64gc-unknown-linux-gnu
            glibc: '2.27'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo zigbuild --release --target ${{ matrix.target }}${{ matrix.glibc && format('.{0}', matrix.glibc) || '' }}

      - name: Prepare artifact
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp target/${{ matrix.target }}/release/${{ env.APP_NAME }} ${{ env.APP_NAME }}-${VERSION}-linux-${{ matrix.arch }}
          chmod +x ${{ env.APP_NAME }}-${VERSION}-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ env.APP_NAME }}-*-linux-${{ matrix.arch }}

  # Debian packages (glibc 2.17 for broad distro compatibility)
  build-deb:
    name: Build deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild and cargo-deb
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild cargo-deb

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo zigbuild --release --target ${{ matrix.target }}.2.17

      - name: Build deb package
        run: cargo deb --no-build --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp target/${{ matrix.target }}/debian/*.deb ${{ env.APP_NAME }}_${VERSION}_${{ matrix.arch }}.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: ${{ env.APP_NAME }}_*.deb

  # RPM packages (glibc 2.17 for broad distro compatibility)
  build-rpm:
    name: Build rpm (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild and cargo-generate-rpm
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild cargo-generate-rpm

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo zigbuild --release --target ${{ matrix.target }}.2.17

      - name: Build rpm package
        # gzip payload: rpm < 4.14 (CentOS 7) can't read the default zstd
        run: cargo generate-rpm --target ${{ matrix.target }} --payload-compress gzip

      - name: Prepare artifact
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp target/${{ matrix.target }}/generate-rpm/*.rpm ${{ env.APP_NAME }}-${VERSION}-1.${{ matrix.arch }}.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.arch }}
          path: ${{ env.APP_NAME }}-*.rpm

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp target/${{ matrix.target }}/release/${{ env.APP_NAME }} ${{ env.APP_NAME }}-${VERSION}-macos-${{ matrix.arch }}
          chmod +x ${{ env.APP_NAME }}-${VERSION}-macos-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ env.APP_NAME }}-*-macos-${{ matrix.arch }}

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          Copy-Item "target/${{ matrix.target }}/release/${{ env.APP_NAME }}.exe" "${{ env.APP_NAME }}-${VERSION}-windows-${{ matrix.arch }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: ${{ env.APP_NAME }}-*-windows-${{ matrix.arch }}.exe

  # Container image: each architecture is built natively (QEMU-emulated Rust
  # builds are very slow) and pushed by digest, then merged into one
  # multi-arch manifest in docker-manifest
  docker-build:
    name: Build Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ inputs.tag || github.ref_name }}
          outputs: type=image,"name=${{ env.IMAGE }},${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Publish Docker image
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 -> 1.2.3, 1.2, 1 and latest; pre-releases (v1.2.3-rc.1) only get
      # their own tag
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        # The same digests were pushed to both registries; one manifest list
        # per registry, each referencing its own copy
        run: |
          for image in "$IMAGE" "$DOCKERHUB_IMAGE"; do
            tags=$(jq -cr --arg img "$image" '.tags | map(select(startswith($img + ":")) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            # shellcheck disable=SC2046,SC2086
            docker buildx imagetools create $tags $(printf "$image@sha256:%s " *)
          done

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$VERSION"

  release:
    name: Create Release
    needs: [build-linux-native, build-linux-cross, build-deb, build-rpm, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/linux-*/* release/ || true
          cp artifacts/macos-*/* release/ || true
          cp artifacts/windows-*/* release/ || true
          cp artifacts/deb-*/* release/ || true
          cp artifacts/rpm-*/* release/ || true
          ls -la release/

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: RDAP ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ask xtomcom/repo to publish this release to repo.xtom.com right away
      # instead of waiting for its daily check. Needs a fine-grained token with
      # Contents: read & write on xtomcom/repo; skipped when it isn't set.
      - name: Trigger repository update
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "REPO_DISPATCH_TOKEN not set, skipping"; exit 0; }
          gh api repos/xtomcom/repo/dispatches -f event_type=upstream-release -f 'client_payload[package]=rdap'
