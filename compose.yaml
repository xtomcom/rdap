# rdap API server: cp .env.example .env && docker compose up -d
services:
  rdap:
    image: xtomcom/rdap:latest      # Docker Hub
    # image: ghcr.io/xtomcom/rdap:latest   # or GitHub Container Registry
    # build: .                      # or build locally
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8888}:8888"
    env_file:
      - path: .env
        required: false
    read_only: true
    volumes:
      - rdap-data:/home/nonroot
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 512

volumes:
  rdap-data:
